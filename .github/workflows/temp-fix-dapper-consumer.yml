name: Temporary Dapper consumer fix

on:
  push:
    branches:
      - docs/dapper-sqlserver-release

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[smoke-fix]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}

      - name: Fix local Dapper consumer restore
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = '''          dotnet add "$consumer_project" package Brazilian.PrimitivesTypes.Dapper.SqlServer \\
            --version "$version" \\
            --source "$GITHUB_WORKSPACE/artifacts/packages" \\
            --source https://api.nuget.org/v3/index.json

          cat > "$consumer/Program.cs" <<'EOF'
'''
          new = '''          dotnet add "$consumer_project" package Brazilian.PrimitivesTypes.Dapper.SqlServer \\
            --version "$version" \\
            --no-restore

          cat > "$consumer/NuGet.Config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$GITHUB_WORKSPACE/artifacts/packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local">
                <package pattern="Brazilian.PrimitivesTypes*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="Dapper" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF

          dotnet restore "$consumer_project" --configfile "$consumer/NuGet.Config"

          cat > "$consumer/Program.cs" <<'EOF'
'''
          if old not in text:
              raise SystemExit('expected Dapper consumer block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "ci: restore Dapper consumer from mapped sources [smoke-fix]"
          git push
