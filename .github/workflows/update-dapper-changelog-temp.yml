name: Update Dapper changelog entry

on:
  pull_request:
    types:
      - synchronize
    branches:
      - main

permissions:
  contents: write

jobs:
  update-changelog:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Add Unreleased changelog entry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          entry = ('- `Brazilian.PrimitivesTypes.Dapper.SqlServer` Dapper integration with type handlers for all 20 supported '
                   'value objects, canonical `Value` persistence, explicit ANSI `varchar(n)` parameter metadata, stable Pix '
                   'canonical rehydration, repeatable global handler registration, and Value-only `Rg`/`InscricaoEstadual` semantics.\n')

          if entry in text:
              raise SystemExit(0)

          marker = '### Added\n\n'
          if marker not in text:
              raise SystemExit('Unreleased Added section not found.')

          text = text.replace(marker, marker + entry, 1)
          path.write_text(text, encoding='utf-8')
          PY

          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi

          encoded="$(base64 -w 0 CHANGELOG.md)"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$HEAD_REF" --jq '.sha')"

          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md" \
            -f message='docs: record Dapper type handler integration' \
            -f content="$encoded" \
            -f sha="$sha" \
            -f branch="$HEAD_REF" >/dev/null
