name: PR 103 Lockfile Regeneration (Temporary)

on:
  push:
    branches:
      - chore/consolidate-dependencies-2026-10-19
    paths:
      - .github/workflows/pr-103-regenerate-lockfiles.yml

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate NuGet lockfiles on .NET 10
    runs-on: ${{ vars.RUNNER_OS || 'ubuntu-26.04' }}
    timeout-minutes: 25
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: chore/consolidate-dependencies-2026-10-19
          persist-credentials: true

      - name: Configure .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Regenerate lockfiles by NuGet restore
        shell: bash
        run: |
          set -euo pipefail
          dotnet --version
          dotnet restore Brazilian.PrimitivesTypes.slnx --force-evaluate
          dotnet restore Brazilian.PrimitivesTypes.slnx --locked-mode

      - name: Commit regenerated lockfiles to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add -u -- ':(glob)**/packages.lock.json'
          if git diff --cached --quiet; then
            echo "No lockfile updates required."
            exit 0
          fi
          git diff --cached --stat
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(deps): regenerate NuGet lockfiles for consolidated updates'
          git push origin HEAD:chore/consolidate-dependencies-2026-10-19
