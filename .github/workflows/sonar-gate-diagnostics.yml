name: Sonar quality gate diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    if: github.head_ref == 'feat/efcore-sqlserver'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - name: Read pull request quality gate
        shell: bash
        env:
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "Sonar configuration is unavailable."
            exit 1
          fi

          curl --fail --silent --show-error \
            --user "${SONAR_TOKEN}:" \
            --get "https://sonarcloud.io/api/qualitygates/project_status" \
            --data-urlencode "projectKey=${SONAR_PROJECT_KEY}" \
            --data-urlencode "pullRequest=${PULL_REQUEST_NUMBER}"
