name: Inspect Sonar quality gate

on:
  pull_request:
    types:
      - synchronize
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Read quality gate conditions
        shell: bash
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "Sonar configuration is unavailable."
            exit 1
          fi

          response="$(curl --fail --silent --show-error \
            --user "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY&pullRequest=${{ github.event.pull_request.number }}")"

          python3 - "$response" <<'PY'
          import json
          import sys

          payload = json.loads(sys.argv[1])['projectStatus']
          print(f"status={payload.get('status')}")
          for condition in payload.get('conditions', []):
              print(
                  f"metric={condition.get('metricKey')} "
                  f"status={condition.get('status')} "
                  f"threshold={condition.get('errorThreshold', '—')} "
                  f"actual={condition.get('actualValue', '—')}"
              )
          PY
