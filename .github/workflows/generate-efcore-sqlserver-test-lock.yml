name: Generate EF Core SQL Server test lock file

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.head_ref == 'feat/efcore-sqlserver'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Generate lock file
        run: dotnet restore tests/Brazilian.PrimitivesTypes.EntityFrameworkCore.SqlServer.Tests/Brazilian.PrimitivesTypes.EntityFrameworkCore.SqlServer.Tests.csproj --force-evaluate

      - name: Commit generated lock file
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lock_file="tests/Brazilian.PrimitivesTypes.EntityFrameworkCore.SqlServer.Tests/packages.lock.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$lock_file"

          if git diff --cached --quiet; then
            echo "Lock file is already current."
            exit 0
          fi

          git commit -m "test(efcore-sqlserver): add generated package lock"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"
