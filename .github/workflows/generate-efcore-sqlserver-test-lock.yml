name: Generate EF Core SQL Server test lock file

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-lock:
    if: github.head_ref == 'feat/efcore-sqlserver'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Generate lock file
        run: dotnet restore tests/Brazilian.PrimitivesTypes.EntityFrameworkCore.SqlServer.Tests/Brazilian.PrimitivesTypes.EntityFrameworkCore.SqlServer.Tests.csproj --force-evaluate

      - name: Upload generated lock file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: efcore-sqlserver-test-lock
          path: tests/Brazilian.PrimitivesTypes.EntityFrameworkCore.SqlServer.Tests/packages.lock.json
          if-no-files-found: error
          retention-days: 1
