name: Temporary Dapper release finalizer

on:
  push:
    branches:
      - docs/dapper-sqlserver-release

permissions:
  contents: write

jobs:
  finalize-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[autopatch]') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}

      - name: Configure .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Apply release and CI integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          dapper_added = '- `Brazilian.PrimitivesTypes.Dapper.SqlServer` Dapper integration with type handlers for all 20 supported value objects, canonical `Value` persistence, explicit ANSI `varchar(n)` parameter metadata, stable Pix canonical rehydration, repeatable global handler registration, and Value-only `Rg`/`InscricaoEstadual` semantics.\n'
          docs_added = '- Complete Portuguese and English Dapper + SQL Server consumer guides covering registration, `SqlConnection`, CRUD parameters, nullable values, `DynamicParameters`, recommended `varchar(n)` schema, list-expansion limitations, Value-only RG/IE semantics, EF Core comparison, and NuGet Trusted Publishing prerequisites.\n'
          if docs_added not in text:
              text = text.replace(dapper_added, dapper_added + docs_added)
          changed_heading = '### Changed\n\n'
          release_changed = '- CI and release packaging now build, validate, consume, and publish `Brazilian.PrimitivesTypes.Dapper.SqlServer` together with the existing packages; the local consumer validation also rejects accidental transitive Entity Framework Core dependencies.\n'
          if release_changed not in text:
              text = text.replace(changed_heading, changed_heading + release_changed)
          changelog.write_text(text)

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text()
          old_pack = '''          dotnet pack src/Brazilian.PrimitivesTypes/Brazilian.PrimitivesTypes.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/Brazilian.PrimitivesTypes.EntityFrameworkCore.SqlServer/Brazilian.PrimitivesTypes.EntityFrameworkCore.SqlServer.csproj --configuration Release --no-build --output artifacts/packages
'''
          new_pack = old_pack + '          dotnet pack src/Brazilian.PrimitivesTypes.Dapper.SqlServer/Brazilian.PrimitivesTypes.Dapper.SqlServer.csproj --configuration Release --no-build --output artifacts/packages\n'
          if 'dotnet pack src/Brazilian.PrimitivesTypes.Dapper.SqlServer/' not in text:
              text = text.replace(old_pack, new_pack)

          old_verify = '''          dotnet run --file scripts/verify-package.cs -- artifacts/packages --package-id Brazilian.PrimitivesTypes --require-source-link
          dotnet run --file scripts/verify-package.cs -- artifacts/packages --package-id Brazilian.PrimitivesTypes.EntityFrameworkCore.SqlServer --expected-dependency Brazilian.PrimitivesTypes --require-source-link
'''
          new_verify = old_verify + '''          dotnet run --file scripts/verify-package.cs -- artifacts/packages --package-id Brazilian.PrimitivesTypes.Dapper.SqlServer --expected-dependency Brazilian.PrimitivesTypes --require-source-link
          dotnet run --file scripts/verify-package.cs -- artifacts/packages --package-id Brazilian.PrimitivesTypes.Dapper.SqlServer --expected-dependency Dapper --require-source-link
'''
          if '--package-id Brazilian.PrimitivesTypes.Dapper.SqlServer --expected-dependency Dapper --require-source-link' not in text:
              text = text.replace(old_verify, new_verify)

          old_consumer_end = '''          dotnet build "$consumer_project" --configuration Release --no-restore
'''
          dapper_consumer = '''          dotnet build "$consumer_project" --configuration Release --no-restore

          dapper_consumer="$(mktemp -d)"
          dotnet new console --framework net10.0 --output "$dapper_consumer"
          dapper_consumer_project="$(find "$dapper_consumer" -maxdepth 1 -name '*.csproj' -print -quit)"

          if [ -z "$dapper_consumer_project" ]; then
            echo "Projeto consumidor Dapper temporário não foi criado."
            exit 1
          fi

          dotnet add "$dapper_consumer_project" package Brazilian.PrimitivesTypes.Dapper.SqlServer \\
            --version "$version" \\
            --source "$GITHUB_WORKSPACE/artifacts/packages" \\
            --source https://api.nuget.org/v3/index.json

          cat > "$dapper_consumer/Program.cs" <<'EOF'
          using Brazilian.PrimitivesTypes;
          using Brazilian.PrimitivesTypes.Dapper.SqlServer;

          BrazilianPrimitivesDapperSqlServer.Register();
          _ = Cpf.Parse("529.982.247-25");
          Console.WriteLine("Brazilian.PrimitivesTypes.Dapper.SqlServer package consumed successfully.");
          EOF

          dependency_graph="$(dotnet list "$dapper_consumer_project" package --include-transitive)"
          echo "$dependency_graph"

          if grep -Fq 'Microsoft.EntityFrameworkCore' <<< "$dependency_graph"; then
            echo "O pacote Dapper não pode introduzir Entity Framework Core direta ou transitivamente."
            exit 1
          fi

          dotnet build "$dapper_consumer_project" --configuration Release --no-restore
'''
          if 'Projeto consumidor Dapper temporário não foi criado.' not in text:
              text = text.replace(old_consumer_end, dapper_consumer, 1)
          ci.write_text(text)

          release = Path('.github/workflows/release.yml')
          text = release.read_text()
          old_version = '''          project='src/Brazilian.PrimitivesTypes/Brazilian.PrimitivesTypes.csproj'

          resolved_version="$(dotnet msbuild "$project" -nologo -getProperty:Version -p:Version="$PACKAGE_VERSION" \\
            | tr -d '\\r' | sed '/^[[:space:]]*$/d' | tail -n 1)"
          resolved_package_version="$(dotnet msbuild "$project" -nologo -getProperty:PackageVersion -p:Version="$PACKAGE_VERSION" \\
            | tr -d '\\r' | sed '/^[[:space:]]*$/d' | tail -n 1)"

          if [ "$resolved_version" != "$PACKAGE_VERSION" ]; then
            echo "::error::Resolved Version '$resolved_version' differs from release version '$PACKAGE_VERSION'."
            exit 1
          fi

          if [ "$resolved_package_version" != "$PACKAGE_VERSION" ]; then
            echo "::error::Resolved PackageVersion '$resolved_package_version' differs from release version '$PACKAGE_VERSION'."
            exit 1
          fi
'''
          new_version = '''          projects=(
            'src/Brazilian.PrimitivesTypes/Brazilian.PrimitivesTypes.csproj'
            'src/Brazilian.PrimitivesTypes.EntityFrameworkCore.SqlServer/Brazilian.PrimitivesTypes.EntityFrameworkCore.SqlServer.csproj'
            'src/Brazilian.PrimitivesTypes.Dapper.SqlServer/Brazilian.PrimitivesTypes.Dapper.SqlServer.csproj'
          )

          for project in "${projects[@]}"; do
            resolved_version="$(dotnet msbuild "$project" -nologo -getProperty:Version -p:Version="$PACKAGE_VERSION" \\
              | tr -d '\\r' | sed '/^[[:space:]]*$/d' | tail -n 1)"
            resolved_package_version="$(dotnet msbuild "$project" -nologo -getProperty:PackageVersion -p:Version="$PACKAGE_VERSION" \\
              | tr -d '\\r' | sed '/^[[:space:]]*$/d' | tail -n 1)"

            if [ "$resolved_version" != "$PACKAGE_VERSION" ]; then
              echo "::error::$project resolved Version '$resolved_version' differs from release version '$PACKAGE_VERSION'."
              exit 1
            fi

            if [ "$resolved_package_version" != "$PACKAGE_VERSION" ]; then
              echo "::error::$project resolved PackageVersion '$resolved_package_version' differs from release version '$PACKAGE_VERSION'."
              exit 1
            fi
          done
'''
          if "'src/Brazilian.PrimitivesTypes.Dapper.SqlServer/Brazilian.PrimitivesTypes.Dapper.SqlServer.csproj'" not in text.split('- name: Validate resolved MSBuild version', 1)[1].split('- name: Build Release', 1)[0]:
              text = text.replace(old_version, new_version)

          old_release_pack = '''          dotnet pack src/Brazilian.PrimitivesTypes.EntityFrameworkCore.SqlServer/Brazilian.PrimitivesTypes.EntityFrameworkCore.SqlServer.csproj \\
            --configuration Release \\
            --no-build \\
            --output artifacts/packages \\
            -p:Version="$PACKAGE_VERSION"
'''
          new_release_pack = old_release_pack + '''          dotnet pack src/Brazilian.PrimitivesTypes.Dapper.SqlServer/Brazilian.PrimitivesTypes.Dapper.SqlServer.csproj \\
            --configuration Release \\
            --no-build \\
            --output artifacts/packages \\
            -p:Version="$PACKAGE_VERSION"
'''
          pack_section = text.split('- name: Pack release artifacts', 1)[1].split('- name: Validate packages', 1)[0]
          if 'Brazilian.PrimitivesTypes.Dapper.SqlServer.csproj' not in pack_section:
              text = text.replace(old_release_pack, new_release_pack)

          old_release_verify = '''          dotnet run --file scripts/verify-package.cs -- artifacts/packages \\
            --package-id Brazilian.PrimitivesTypes.EntityFrameworkCore.SqlServer \\
            --expected-dependency Brazilian.PrimitivesTypes \\
            --require-source-link \\
            --expected-version "$PACKAGE_VERSION"
'''
          new_release_verify = old_release_verify + '''          dotnet run --file scripts/verify-package.cs -- artifacts/packages \\
            --package-id Brazilian.PrimitivesTypes.Dapper.SqlServer \\
            --expected-dependency Brazilian.PrimitivesTypes \\
            --require-source-link \\
            --expected-version "$PACKAGE_VERSION"
          dotnet run --file scripts/verify-package.cs -- artifacts/packages \\
            --package-id Brazilian.PrimitivesTypes.Dapper.SqlServer \\
            --expected-dependency Dapper \\
            --require-source-link \\
            --expected-version "$PACKAGE_VERSION"
'''
          verify_section = text.split('- name: Validate packages, versions, assembly metadata, symbols and Source Link', 1)[1].split('- name: Upload release artifacts', 1)[0]
          if '--package-id Brazilian.PrimitivesTypes.Dapper.SqlServer' not in verify_section:
              text = text.replace(old_release_verify, new_release_verify)
          release.write_text(text)
          PY

      - name: Commit integrated files
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/ci.yml .github/workflows/release.yml
          git commit -m "chore: integrate Dapper package into CI and release [autopatch]"
          git push

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies in locked mode
        run: dotnet restore Brazilian.PrimitivesTypes.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format Brazilian.PrimitivesTypes.slnx --verify-no-changes --no-restore

      - name: Build Release
        run: dotnet build Brazilian.PrimitivesTypes.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Brazilian.PrimitivesTypes.slnx --configuration Release --no-build

      - name: Pack all distributable packages
        run: |
          dotnet pack src/Brazilian.PrimitivesTypes/Brazilian.PrimitivesTypes.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/Brazilian.PrimitivesTypes.EntityFrameworkCore.SqlServer/Brazilian.PrimitivesTypes.EntityFrameworkCore.SqlServer.csproj --configuration Release --no-build --output artifacts/packages
          dotnet pack src/Brazilian.PrimitivesTypes.Dapper.SqlServer/Brazilian.PrimitivesTypes.Dapper.SqlServer.csproj --configuration Release --no-build --output artifacts/packages

      - name: Verify Dapper package contract
        run: |
          dotnet run --file scripts/verify-package.cs -- artifacts/packages --package-id Brazilian.PrimitivesTypes.Dapper.SqlServer --expected-dependency Brazilian.PrimitivesTypes --require-source-link
          dotnet run --file scripts/verify-package.cs -- artifacts/packages --package-id Brazilian.PrimitivesTypes.Dapper.SqlServer --expected-dependency Dapper --require-source-link
