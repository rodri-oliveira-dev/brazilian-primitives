name: Regenerate Dapper lock files

on:
  pull_request:
    types:
      - opened
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate-lock-files:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Configure .NET 10.0.303
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.303'

      - name: Regenerate package lock files
        run: dotnet restore Brazilian.PrimitivesTypes.slnx --force-evaluate

      - name: Commit generated Dapper lock files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          lock_files=(
            'src/Brazilian.PrimitivesTypes.Dapper.SqlServer/packages.lock.json'
            'tests/Brazilian.PrimitivesTypes.Dapper.SqlServer.Tests/packages.lock.json'
          )

          for path in "${lock_files[@]}"; do
            if [ ! -s "$path" ]; then
              echo "::error::Expected lock file '$path' was not generated."
              exit 1
            fi

            encoded="$(base64 -w 0 "$path")"
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
              -f message='build: regenerate Dapper package lock files' \
              -f content="$encoded" \
              -f branch="$HEAD_REF" >/dev/null
          done
