name: Validate Dapper package

on:
  pull_request:
    types:
      - synchronize
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies in locked mode
        run: dotnet restore Brazilian.PrimitivesTypes.slnx --locked-mode

      - name: Build Release
        run: dotnet build Brazilian.PrimitivesTypes.slnx --configuration Release --no-restore

      - name: Pack Dapper integration
        run: >-
          dotnet pack src/Brazilian.PrimitivesTypes.Dapper.SqlServer/Brazilian.PrimitivesTypes.Dapper.SqlServer.csproj
          --configuration Release
          --no-build
          --output artifacts/packages

      - name: Validate package and Source Link
        run: >-
          dotnet run --file scripts/verify-package.cs -- artifacts/packages
          --package-id Brazilian.PrimitivesTypes.Dapper.SqlServer
          --expected-dependency Brazilian.PrimitivesTypes
          --require-source-link
