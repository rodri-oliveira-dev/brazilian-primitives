name: SonarQube Cloud

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analisar com SonarQube Cloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || format('{0}_{1}', github.repository_owner, github.event.repository.name) }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || github.repository_owner }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

    steps:
      - name: SonarQube Cloud desabilitado
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN não configurado; análise SonarQube Cloud ignorada."

      - name: Checkout
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar .NET 10
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Validar configuração Sonar
        if: ${{ env.SONAR_TOKEN != '' }}
        shell: bash
        run: |
          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "SONAR_PROJECT_KEY não pôde ser resolvido. Configure a Repository Variable SONAR_PROJECT_KEY."
            exit 1
          fi

          if [ -z "$SONAR_ORGANIZATION" ]; then
            echo "SONAR_ORGANIZATION não pôde ser resolvida. Configure a Repository Variable SONAR_ORGANIZATION."
            exit 1
          fi

          if [ -z "$SONAR_HOST_URL" ]; then
            echo "SONAR_HOST_URL não pôde ser resolvida. Configure a Repository Variable SONAR_HOST_URL."
            exit 1
          fi

          echo "Sonar project key: $SONAR_PROJECT_KEY"
          echo "Sonar organization: $SONAR_ORGANIZATION"
          echo "Sonar host: $SONAR_HOST_URL"

      - name: Restaurar ferramentas locais
        if: ${{ env.SONAR_TOKEN != '' }}
        run: dotnet tool restore

      - name: Restaurar dependências em locked mode
        if: ${{ env.SONAR_TOKEN != '' }}
        run: dotnet restore Brazilian.Primitives.slnx --locked-mode

      - name: Iniciar análise Sonar
        if: ${{ env.SONAR_TOKEN != '' }}
        shell: bash
        run: >-
          dotnet sonarscanner begin
          /k:"$SONAR_PROJECT_KEY"
          /o:"$SONAR_ORGANIZATION"
          /d:sonar.host.url="$SONAR_HOST_URL"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover*.xml"
          /d:sonar.qualitygate.wait=true
          /d:sonar.qualitygate.timeout=300

      - name: Compilar para análise
        if: ${{ env.SONAR_TOKEN != '' }}
        run: dotnet build Brazilian.Primitives.slnx --configuration Release --no-restore --no-incremental

      - name: Executar testes e coletar cobertura OpenCover
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >-
          dotnet test Brazilian.Primitives.slnx
          --configuration Release
          --no-build
          --coverlet
          --coverlet-output-format opencover

      - name: Finalizar e enviar análise
        if: ${{ env.SONAR_TOKEN != '' }}
        shell: bash
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Diagnosticar métricas Sonar da main
        if: ${{ always() && env.SONAR_TOKEN != '' }}
        shell: bash
        run: |
          echo "Quality Gate associado:"
          curl --silent --show-error --user "$SONAR_TOKEN:" \
            --get "$SONAR_HOST_URL/api/qualitygates/get_by_project" \
            --data-urlencode "project=$SONAR_PROJECT_KEY" \
            | jq '{qualityGate}' || true

          metrics="$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            "$SONAR_HOST_URL/api/metrics/search?ps=500")"

          metric_keys="$(echo "$metrics" | jq -r '[
            .metrics[].key
            | select(
                . == "coverage"
                or . == "duplicated_lines_density"
                or . == "reliability_rating"
                or . == "security_rating"
                or . == "sqale_rating"
                or . == "security_hotspots_reviewed"
                or . == "new_coverage"
                or . == "new_duplicated_lines_density"
                or . == "new_reliability_rating"
                or . == "new_security_rating"
                or . == "new_maintainability_rating"
                or . == "new_security_hotspots_reviewed"
              )
          ] | join(",")')"

          echo "Métricas disponíveis para diagnóstico: $metric_keys"

          measures="$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            --get "$SONAR_HOST_URL/api/measures/component" \
            --data-urlencode "component=$SONAR_PROJECT_KEY" \
            --data-urlencode "branch=main" \
            --data-urlencode "metricKeys=$metric_keys")"

          echo "$measures" | jq '{
            component: .component.key,
            measures: [
              .component.measures[]
              | {
                  metric,
                  value,
                  period
                }
            ]
          }'

          issues="$(curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            --get "$SONAR_HOST_URL/api/issues/search" \
            --data-urlencode "componentKeys=$SONAR_PROJECT_KEY" \
            --data-urlencode "branch=main" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=1" \
            --data-urlencode "facets=types,severities")"

          echo "$issues" | jq '{
            openIssues: .total,
            facets: .facets
          }'
